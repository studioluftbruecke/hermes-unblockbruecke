schema: 1
deck: "shaders"
name: "Shaders"
by: "Studio Luftbrücke"
license: "CC-BY-4.0"
version: 2
faces: [human, agent]
mark: "sphere"
area: "shaders"
description: "Black screens, banding, jitter and noise that looks like static"
voice: "A demoscener at 2 a.m., tired, cheerful, and sure the bug is one line away."
glossary:
  debug: "Makes the shader show its own values so you can see where it breaks."
  color: "Checks colour space, gamma and how the final pixel is written."
  precision: "Deals with floats running out of bits: banding, jitter, drift."
  time: "Untangles the time uniform: freezing it, wrapping it, stepping it."
  noise: "Gets noise under control before it gets clever."
  math: "Hunts the division, root or power that blows up to NaN."
cards:
  - id: "sh-01"
    human: "Black screen? Paint it red first."
    agent: "Make the shader output solid red, then the uv as red and green, then step back toward the real output one line at a time until the picture breaks."
    tags: [debug]
  - id: "sh-02"
    human: "Banding is your bit depth confessing."
    agent: "Add a small hash dither of about one 255th to the final colour before output, and compare the gradient with and without it side by side."
    tags: [color, precision]
  - id: "sh-03"
    human: "Ran fine at launch, shakes after an hour?"
    agent: "Feed the shader a huge time value on purpose to reproduce the jitter now, then wrap time with mod over a period the effect repeats on."
    tags: [time, precision]
  - id: "sh-04"
    human: "Is the uniform even home?"
    agent: "Hard-code every uniform the effect depends on inside the shader. If the picture fixes itself, the bug is on the side that sends the values."
    tags: [debug]
  - id: "sh-05"
    human: "Gamma is quietly lying to you."
    agent: "Check where the maths happens: convert inputs to linear, blend there, convert back to display colour once at the very end, and compare with the old output."
    tags: [color]
  - id: "sh-06"
    human: "Your noise looks like a TV with no aerial."
    agent: "Swap the noise call for a plain checker to prove the coordinates first, then bring noise back with a single octave and add octaves while watching."
    tags: [noise, debug]
  - id: "sh-07"
    human: "Almost zero divided is almost infinity."
    agent: "Find every division, normalize, pow and sqrt fed by a value that can reach zero or go negative; paint any pixel whose value is not equal to itself, a NaN, in magenta, then clamp."
    tags: [math, debug]
  - id: "sh-08"
    human: "Freeze time, then nudge one knob."
    agent: "Pin time to a value where it looks wrong, change one constant per render, and only let time run again once the still frame looks right."
    tags: [time, debug]
  - id: "sh-09"
    human: "Fold it once, then again."
    agent: "Mirror the uv with abs, then fold it into segments around the centre. Put the segment count on a slider from 1 to 12 and render 1, 3 and 8 next to the original."
    tags: [math]
  - id: "sh-10"
    human: "Let one corner run backwards."
    agent: "Mask one corner softly and feed it negative time while the rest runs on. Put the mask radius on a slider and render the original and the new version at the same time value."
    tags: [time]
  - id: "sh-11"
    human: "Borrow three colours from the room."
    agent: "Ask for three colours the person can see right now, build a cosine palette from them and swap it in for the current colour ramp. Render the old and the new ramp side by side."
    tags: [color, human]
  - id: "sh-12"
    human: "Turn the pixels into bricks."
    agent: "Snap the uv to a coarse grid before anything samples it and posterize the colour to a few levels. Put grid size and levels on sliders and render it next to the original."
    tags: [color]
  - id: "sh-13"
    human: "Give it a heartbeat."
    agent: "Multiply the main scale or brightness by a pulse with a sharp attack and a slow decay. Put beats per minute and depth on sliders and render a few frames before and after."
    tags: [time]
  - id: "sh-14"
    human: "Look at it through a bent lens."
    agent: "Bend the uv with a barrel distortion around the centre before anything else runs, with the strength on a slider from minus to plus. Render it flat, pinched and bulged side by side."
    tags: [math]
  - id: "sh-15"
    human: "Push one knob far past sensible."
    agent: "Find the constant the look depends on most, widen its slider to ten times its normal range both ways, and render the three strangest frames you find next to the original."
    tags: [math]
  - id: "sh-16"
    human: "Keep only the edges."
    agent: "Find the brightness edges of the final colour with screen-space derivatives and draw only those as lines. Blend from the original to the line drawing on a slider and render both ends."
    tags: [color]
