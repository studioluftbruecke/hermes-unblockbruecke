schema: 1
deck: "writing"
name: "Writing"
by: "Studio Luftbrücke"
license: "CC-BY-4.0"
version: 2
faces: [human, agent]
mark: "pencil"
area: "writing"
description: "Blank pages, stalled drafts and prose that will not read"
voice: "An editor with a red pencil and a soft spot for writers who keep going."
glossary:
  start: "Gets the first real words down."
  draft: "Keeps a stalled draft moving instead of polishing it."
  prose: "Fixes sentences that trip, sag or say two things at once."
  structure: "Checks the order and the reader before the wording."
cards:
  - id: "wr-01"
    human: "Write the version you'd tell at the bar."
    agent: "Ask the writer how they would tell this to a friend over a drink, type it word for word, and use it as the first line of the draft."
    tags: [start, human]
  - id: "wr-02"
    human: "Start in the middle, where it's warm."
    agent: "Ask which scene or point the writer is surest about, draft that one first, and leave the opening to be written last."
    tags: [start, structure, human]
  - id: "wr-03"
    human: "Hide the first paragraph. See who notices."
    agent: "Hide the first paragraph and read from the second; if nothing is lost, offer the second as the new opening."
    tags: [prose, structure]
  - id: "wr-04"
    human: "Read it aloud, pencil in hand."
    agent: "Read the stuck passage aloud or have it read back, mark every place the breath runs out or the tongue trips, and rewrite only the marked sentences."
    tags: [prose]
  - id: "wr-05"
    human: "One idea per sentence. No stowaways."
    agent: "Find the longest sentence in the passage, split it at each 'and', 'which' and 'but', and keep only the pieces that carry an idea of their own."
    tags: [prose]
  - id: "wr-06"
    human: "Outline it after you've written it."
    agent: "Write one line per paragraph saying what the paragraph does, not what it says; reorder the lines, then move the paragraphs to match."
    tags: [structure, draft]
  - id: "wr-07"
    human: "Leave holes and keep walking."
    agent: "Mark every missing fact, name or word with a placeholder like TK and keep drafting past it; fill all the placeholders in one separate pass afterwards."
    tags: [draft, start]
  - id: "wr-08"
    human: "Who is this for, by first name?"
    agent: "Ask the writer to name one real reader, then reread the draft as that person and mark the first line where they would stop reading."
    tags: [structure, human]
  - id: "wr-09"
    human: "Write it as a letter to one person."
    agent: "Ask who one real reader is, then rewrite the opening as a letter to them by name. Show both versions side by side and mark the lines from the letter worth keeping."
    tags: [structure, human]
  - id: "wr-10"
    human: "Cut it to six words, then grow it back."
    agent: "Boil the piece down to six words, then rebuild it one sentence at a time from those six. Show the original and the regrown version side by side."
    tags: [prose]
  - id: "wr-11"
    human: "Swap the tense and see who wakes up."
    agent: "Rewrite one paragraph in the present tense, or in the past if it already is present. Show both and point out which lines got sharper and which went flat."
    tags: [prose]
  - id: "wr-12"
    human: "Let the object tell it."
    agent: "Pick one object in the text and retell a short passage from its point of view. Put it next to the original and name the detail the object noticed that the narrator missed."
    tags: [draft]
  - id: "wr-13"
    human: "Each sentence shorter than the last."
    agent: "Rewrite one paragraph so every sentence is shorter than the one before, ending on two or three words. Show before and after and say where the rhythm landed."
    tags: [prose]
  - id: "wr-14"
    human: "Open with the last line."
    agent: "Move the closing sentence to the very top and let the rest explain how it got there, changing as few other words as you can. Show the reordered draft beside the original."
    tags: [structure]
  - id: "wr-15"
    human: "Add one sentence nobody asked for."
    agent: "In the flattest paragraph, offer three oddly specific sentences (a smell, a price, a time of day), each shown in place. The writer keeps one or none."
    tags: [prose, human]
  - id: "wr-16"
    human: "Headline first, then a whisper."
    agent: "Restate the main point three ways: as a newspaper headline, as one spoken sentence, and as a whisper to a friend. Show all three next to the original and offer the best as a new first line."
    tags: [start]
