name: unblockbruecke
version: "0.2.2"
description: "Cards to unblock yourself or your agent, drawn by you when you are stuck and by Hermes when its tool calls keep failing. Original decks, your own decks, local files, no account."
author: "Studio Luftbrücke"
license: MIT
requires_hermes: ">=0.23.0"
provides_tools:
  - unblockbruecke_card
  - unblockbruecke_decks
provides_hooks:
  - transform_tool_result
  - transform_llm_output
config_schema:
  autodraw:
    type: boolean
    default: false
    label: "Hermes draws when stuck"
    description: "After 3 failed tool calls out of the last 5, Hermes gets one card with a next move. The call still counts as failed."
  autodraw_threshold:
    type: integer
    default: 3
    label: "Failed calls before a card"
    description: "How many failed calls bring a card (2 to 6), counted over the last few calls of a turn."
  card_of_day:
    type: boolean
    default: true
    label: "Card of the day"
    description: "One card for you each day in the status bar."
  learning:
    type: boolean
    default: true
    label: "Decks learn"
    description: "Cards you mark as helped come up a little more often. None disappears."
  show_in_statusbar:
    type: boolean
    default: true
    label: "Show in status bar"
    description: "Shows the chip with the card of the day in the status bar. When off, draw from the page, the command palette or the shortcut."
