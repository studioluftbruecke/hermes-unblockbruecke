name: unblockbruecke
version: "0.1.4"
description: "Cards to unblock yourself or your agent, drawn by you when you are stuck and by Hermes when its tool calls keep failing. Original decks, your own decks, local files, no account."
author: "Studio Luftbrücke"
license: MIT
requires_hermes: ">=0.23.0"
provides_tools:
  - unblockbruecke_card
  - unblockbruecke_decks
provides_hooks:
  - transform_tool_result
config_schema:
  autodraw:
    type: boolean
    default: false
    label: "Hermes draws when stuck"
    description: "Off by default. After 3 failed tool calls in a row in one turn, the failing result carries one card with a next move. The call still fails."
  autodraw_threshold:
    type: integer
    default: 3
    label: "Failed tool calls in a row"
    description: "How many failed tool calls in a row, in one turn and across any tools, bring a card (2 to 6). A successful call starts the count again."
  autodraw_per_turn:
    type: integer
    default: 1
    label: "Cards per turn at most"
    description: "At most this many auto-drawn cards in one turn (1 to 3)."
  autodraw_decks:
    type: list
    default: ["agent-unblock"]
    label: "Decks Hermes may draw from"
    description: "Deck names, e.g. [\"agent-unblock\"]. A deck counts only while its Auto switch is on (Unblockbrücke page, Decks); imported decks start off."
  card_of_day:
    type: boolean
    default: true
    label: "Card of the day"
    description: "One card for you each day, shown in the Draw popover before you draw."
  learning:
    type: boolean
    default: true
    label: "Decks learn"
    description: "Cards you rated as helpful come up a little more often; none disappears. Reset on the Unblockbrücke page, Journal."
  show_in_statusbar:
    type: boolean
    default: true
    label: "Show in status bar"
    description: "Shows the Draw button in the status bar. When off, draw from the page, the command palette or the shortcut."
