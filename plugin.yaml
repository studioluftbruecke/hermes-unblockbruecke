name: unblockbruecke
version: "0.1.2"
description: "Cards to unblock yourself or your agent, drawn by you when you are stuck and by Hermes when its tool calls keep failing. Original decks, your own decks, local files, no account."
author: "Studio Luftbrücke"
license: MIT
requires_hermes: ">=0.23.0"
provides_tools:
  - unblockbruecke_card
  - unblockbruecke_decks
provides_hooks:
  - transform_tool_result
config_schema:
  autodraw:
    type: boolean
    default: false
    label: "Hermes draws when stuck"
    description: "Off by default. After 3 failed tool calls in a row in one turn, the failing result carries one card with a next move. The call still fails."
  autodraw_threshold:
    type: integer
    default: 3
    label: "Failed tool calls in a row"
    description: "How many failed tool calls in a row, in one turn and across any tools, bring a card (2 to 6). A successful call starts the count again."
  autodraw_per_turn:
    type: integer
    default: 1
    label: "Cards per turn at most"
    description: "At most this many auto-drawn cards in one turn (1 to 3)."
  autodraw_decks:
    type: list
    default: ["agent-unblock"]
    label: "Decks Hermes may draw from"
    description: "Deck names, e.g. [\"agent-unblock\"]. A deck counts only while its Auto switch is on (UnblockCards, Decks); imported decks start off."
  card_of_day:
    type: boolean
    default: true
    label: "Card of the day"
    description: "One card from Human unblock each day in the status bar, picked by the date in Hermes' time zone."
  learning:
    type: boolean
    default: true
    label: "Decks learn"
    description: "Cards you rated as helpful come up a little more often; none disappears. Reset in UnblockCards, Journal."
  show_in_sidebar:
    type: boolean
    default: true
    label: "Show in sidebar"
    description: "Shows UnblockCards in the Desktop sidebar. When off, open it from the command palette (Open decks) or the card-of-the-day chip."
